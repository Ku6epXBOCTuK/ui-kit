name: Publish package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для релиза (например, 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Cocogitto
        uses: ./.github/actions/setup-cocogitto

      - name: Sync and Reset
        run: |
          git fetch origin main --tags --force
          git reset --hard origin/main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check published version
        id: published
        run: |
          if npm view "@ku6epxboctuk/ui-kit@${{ inputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ inputs.version }} is already published."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: pnpm publish --no-git-checks --access public

      - name: Get Changelog
        id: version_info
        run: |
          VERSION=${{ inputs.version }}
          cog changelog $VERSION > GITHUB_CHANGELOG.md || true
          if [ ! -s GITHUB_CHANGELOG.md ]; then
            echo "Release version $VERSION" > GITHUB_CHANGELOG.md
            echo "::warning title=Changelog::Changelog was empty, used default text."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body_path: GITHUB_CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
